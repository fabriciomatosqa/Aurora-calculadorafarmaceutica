name: Android - testes, APK e Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Criar projeto Android sem sobrescrever fontes
        run: flutter create --project-name aurora_calculadora_farmaceutica --org br.com.aurora --platforms android .
      - name: Preparar permissões Android e assinatura opcional
        env:
          AURORA_KEYSTORE_BASE64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
          AURORA_KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
          AURORA_KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
          AURORA_KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: python3 scripts/configure_android.py
      - name: Instalar dependências
        run: flutter pub get
      - name: Registrar versão das ferramentas
        run: |
          flutter --version
          dart --version
          mkdir -p .ci-logs
      - name: Validar código
        shell: bash
        run: |
          set -o pipefail
          # Warnings and style suggestions remain visible in the log but
          # only analyzer errors block tests and APK compilation.
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee .ci-logs/flutter-analyze.log
      - name: Executar testes unitários e widgets
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee .ci-logs/flutter-test.log
      - name: Compilar APK de teste
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee .ci-logs/flutter-build-android.log
      - name: Guardar logs quando o job falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-android-${{ github.run_number }}
          path: .ci-logs/
          retention-days: 14
          if-no-files-found: warn
      - name: Publicar APK de teste nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurora-farmaceutica-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Compilar APK release assinado
        if: github.ref == 'refs/heads/main' && env.AURORA_RELEASE_READY == 'true'
        env:
          AURORA_KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
          AURORA_KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
          AURORA_KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Montar APK versionado e checksum
        if: github.ref == 'refs/heads/main' && env.AURORA_RELEASE_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid pubspec version"; exit 1
          fi
          mkdir -p dist
          NAME="aurora-calculadora-farmaceutica-v${VERSION}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${NAME}"
          (cd dist && sha256sum "${NAME}" > "${NAME}.sha256")
          echo "AURORA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "AURORA_APK_NAME=$NAME" >> "$GITHUB_ENV"
      - name: Publicar release APK como artifact
        if: github.ref == 'refs/heads/main' && env.AURORA_RELEASE_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-farmaceutica-release-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publicar APK assinado no repositório PÚBLICO de distribuição
        if: github.ref == 'refs/heads/main' && env.AURORA_RELEASE_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AURORA_PUBLIC_RELEASE_TOKEN }}
          DISTRIBUTION_REPO: fabriciomatosqa/aurora-calculadora-farmaceutica-updates
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::Atualização pública pendente: configure AURORA_PUBLIC_RELEASE_TOKEN."
            echo "APK assinado nos Artifacts, mas ainda NÃO acessível pelo atualizador online." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$DISTRIBUTION_REPO" =~ ^fabriciomatosqa/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::AURORA_PUBLIC_RELEASE_REPO deve ser da conta fabriciomatosqa"
            exit 1
          fi
          if [[ "$(gh api "repos/$DISTRIBUTION_REPO" --jq '.private')" != "false" ]]; then
            echo "::error::O repositório de distribuição precisa ser público"
            exit 1
          fi
          TAG="v${AURORA_VERSION}"
          if gh release view "$TAG" --repo "$DISTRIBUTION_REPO" >/dev/null 2>&1; then
            echo "Release $TAG já está publicado no canal público. Não sobrescrevendo."
            exit 0
          fi
          gh release create "$TAG" "dist/${AURORA_APK_NAME}" "dist/${AURORA_APK_NAME}.sha256" \
            --repo "$DISTRIBUTION_REPO" \
            --title "AURORA Calculadora Farmacêutica $TAG" \
            --notes "Nova versão Android. Baixe o APK assinado e confirme a instalação no dispositivo." \
            --latest
          echo "Atualização disponível: https://github.com/$DISTRIBUTION_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
