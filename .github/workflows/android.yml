name: Android APK - testes e compilação

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar plataforma Android do projeto
        run: flutter create --project-name aurora_calculadora_farmaceutica --org br.com.aurora --platforms android .
      - name: Instalar dependências
        run: flutter pub get
      - name: Analisar código
        run: flutter analyze
      - name: Executar testes
        run: flutter test
      - name: Compilar APK de teste instalável
        run: flutter build apk --debug
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: aurora-calculadora-farmaceutica-android-v0.1.0-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
