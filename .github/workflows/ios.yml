name: iOS - compilação de simulador

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar plataforma iOS do projeto
        run: flutter create --project-name aurora_calculadora_farmaceutica --org br.com.aurora --platforms ios .
      - name: Instalar dependências
        run: flutter pub get
      - name: Executar testes
        run: flutter test
      - name: Compilar app para simulador iOS (sem assinatura)
        run: flutter build ios --simulator --debug
      - name: Publicar app de simulador
        uses: actions/upload-artifact@v4
        with:
          name: aurora-calculadora-farmaceutica-ios-simulator-v0.1.0
          path: build/ios/iphonesimulator/Runner.app/
          if-no-files-found: error
          retention-days: 14
