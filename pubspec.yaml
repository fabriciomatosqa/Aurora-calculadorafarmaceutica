name: aurora_calculadora_farmaceutica
description: Calculadora farmacêutica para laboratório, controle de qualidade e produção.
publish_to: none
version: 0.6.1+7

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  http: ^1.3.0
  crypto: ^3.0.6
  open_filex: ^5.0.0
  package_info_plus: 10.2.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  file_picker: 12.3.0
  google_mlkit_text_recognition: ^0.15.1
  pdfrx: ^2.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
