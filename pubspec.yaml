name: aurora_calculadora_farmaceutica
description: Calculadora farmacêutica para laboratório, controle de qualidade e produção.
publish_to: none
version: 0.5.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  shared_preferences: ^2.3.2
  http: ^1.3.0
  crypto: ^3.0.6
  open_filex: ^5.0.0
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
